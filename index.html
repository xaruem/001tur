<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RITS TOUR</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  html, body {
    height:100%;
    background:#ffffff;
  }

  .page {
    display:flex;
    justify-content:center;
    align-items:center; /* центрирует кадр — свободное место делится поровну сверху и снизу */
    min-height:100dvh;
    background:#ffffff;
  }

  .frame {
    position:relative;
    width:100%;
    max-width:500px;
    background:#ffffff;
  }

  /* фото в своих родных пропорциях, без обрезки и искажений */
  .frame img {
    display:block;
    width:100%;
    height:auto;
  }

  /* ===== Кнопка "Hozir buyurtma qiling" ===== */
  .cta-wrap {
    position:absolute;
    left:21.1%;
    width:58.5%;
    top:86.05%;
    height:6.2%;
  }

  .cta {
    position:relative;
    display:block;
    width:100%;
    height:100%;
    cursor:pointer;
    border-radius:999px;
  }

  /* пульсирующие кольца — привлекают взгляд к кнопке */
  .cta::before,
  .cta::after {
    content:"";
    position:absolute;
    inset:0;
    border-radius:999px;
    border:2px solid rgba(23,143,138,0.9);
    opacity:0;
    animation:ctaPulse 2.6s ease-out infinite;
    pointer-events:none;
  }
  .cta::after {
    animation-delay:0.6s;
  }

  @keyframes ctaPulse {
    0%   { transform:scale(1);    opacity:0.75; }
    70%  { transform:scale(1.18); opacity:0; }
    100% { transform:scale(1.18); opacity:0; }
  }

  /* лёгкое "дыхание" самой кнопки, без искажения кликабельной области */
  .cta-scale {
    position:absolute;
    inset:0;
    border-radius:999px;
    animation:ctaBreathe 2.6s ease-in-out infinite;
    pointer-events:none;
    box-shadow:0 0 0 rgba(23,143,138,0);
  }

  @keyframes ctaBreathe {
    0%, 100% { box-shadow:0 0 0 0 rgba(23,143,138,0.0); }
    50%      { box-shadow:0 0 22px 4px rgba(23,143,138,0.45); }
  }

  /* ===== Telegram-бейдж, выезжающий снизу вверх ===== */
  .tg-badge {
    position:absolute;
    right:2%;
    top:80.5%;
    width:11%;
    aspect-ratio:1/1;
    border-radius:50%;
    background:linear-gradient(160deg,#1fb6ae,#0e6f6a);
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 4px 14px rgba(0,0,0,0.35);
    cursor:pointer;
    z-index:5;
    animation:tgRise 4s ease-in-out infinite;
  }

  .tg-badge svg {
    width:55%;
    height:55%;
    fill:#ffffff;
  }

  @keyframes tgRise {
    0%   { transform:translateY(60%); opacity:0; }
    18%  { transform:translateY(-8%); opacity:1; }
    28%  { transform:translateY(0);   opacity:1; }
    72%  { transform:translateY(0);   opacity:1; }
    88%  { transform:translateY(60%); opacity:0; }
    100% { transform:translateY(60%); opacity:0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .cta::before, .cta::after, .cta-scale, .tg-badge {
      animation:none;
    }
  }
</style>
</head>
<body>
  <div class="page">
    <div class="frame">
      <img src="hero.png" alt="RITS TOUR - Sayohat vaqti keldi">

      <div class="cta-wrap">
        <a class="cta" href="https://t.me/rits_tour" target="_blank" rel="noopener" aria-label="Hozir buyurtma qiling">
          <span class="cta-scale"></span>
        </a>
      </div>

      <a class="tg-badge" href="https://t.me/rits_tour" target="_blank" rel="noopener" aria-label="Telegram orqali yozing">
        <svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
          <path d="M195.7 60.5 168 187.4c-2.1 9.4-7.6 11.7-15.4 7.3l-42.6-31.4-20.6 19.8c-2.3 2.3-4.2 4.2-8.6 4.2l3.1-43.7L163 60.2c3.7-3.3-.8-5.1-5.7-1.8L61.3 121l-42.9-13.4c-9.3-2.9-9.5-9.3 2-13.8L184 47.2c7.8-2.9 14.6 1.9 11.7 13.3z"/>
        </svg>
      </a>
    </div>
  </div>
</body>
</html>
